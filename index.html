<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <title>MenuVerse | Hambúrgueres e Gastronomia Artesanal</title>
    <meta
      name="description"
      content="MenuVerse Gastronomia Experience: hambúrgueres artesanais, batatas trufadas e sabores feitos para surpreender. Peça pelo site e receba em casa ou retire na loja."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="MenuVerse" />
    <link rel="canonical" href="https://menuverse-cardapio.vercel.app/" />

    <!-- Aparência no navegador -->
    <meta name="theme-color" content="#090909" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="MenuVerse" />
    <meta property="og:title" content="MenuVerse | Gastronomia Experience" />
    <meta
      property="og:description"
      content="Hambúrgueres artesanais e sabores intensos. Faça seu pedido pelo site."
    />
    <meta property="og:url" content="https://menuverse-cardapio.vercel.app/" />
    <meta property="og:image" content="https://menuverse-cardapio.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hambúrguer artesanal do MenuVerse" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MenuVerse | Gastronomia Experience" />
    <meta
      name="twitter:description"
      content="Hambúrgueres artesanais e sabores intensos."
    />
    <meta name="twitter:image" content="https://menuverse-cardapio.vercel.app/og-image.jpg" />

    <!-- SEO local: dados estruturados do restaurante -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "MenuVerse",
        "slogan": "Gastronomia Experience",
        "url": "https://menuverse-cardapio.vercel.app/",
        "image": "https://menuverse-cardapio.vercel.app/og-image.jpg",
        "telephone": "+5589981433161",
        "servesCuisine": ["Hambúrgueres", "Gastronomia"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Distrito Federal",
          "addressLocality": "Brasília",
          "addressRegion": "DF",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday"],
            "opens": "18:00",
            "closes": "23:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday", "Sunday"],
            "opens": "18:00",
            "closes": "00:30"
          }
        ],
        "sameAs": ["https://www.instagram.com/carlos_emanuelrf/"]
      }
    </script>
  </head>
  <body>
    <noscript>Ative o JavaScript para ver o cardápio e fazer seu pedido no MenuVerse.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
